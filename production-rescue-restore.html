<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>本番データ救出・復帰</title><style>body{font-family:system-ui;margin:14px;line-height:1.55;color:#17212b}button,input{font-size:16px;max-width:100%}button{min-height:48px;padding:12px 14px;margin:8px 0;width:100%}.card{border:1px solid #ccd5da;border-radius:12px;padding:14px;margin:12px 0}.ok{border-color:#0f5968;background:#f2fbfc}.warn{border-color:#a06000;background:#fff8ea}.danger{border-color:#a00000;background:#fff2f2}.hidden{display:none}.fileline{display:block;margin:14px 0}.fileline input{display:block;margin-top:6px;width:100%}.summary{font-weight:700}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:8px 0}.kv div:nth-child(odd){font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}.success{font-size:18px;font-weight:700}</style></head><body><h1>本番データ救出・復帰</h1><div class="card warn"><b>スマホ用・本番復帰専用</b><br>スマホに保存済みの救出JSONを、同じスマホの本番保存領域 <code>taxiPayPwaStateV10</code> に戻します。救出JSON自体が端末外の安全コピーなので、復帰時に追加ダウンロードは行いません。DEVELOPデータとGoogle Driveには触れません。</div><div class="card"><label class="fileline">救出JSONを選択<input id="file" type="file" accept="application/json,.json"><span id="fileinfo">未選択</span></label><button id="inspect">内容を確認</button></div><div id="preview" class="card hidden"></div><div id="restoreBox" class="card danger hidden"><b>検証可能な復帰テストを行います。</b><br>現在の本番データを端末内に二重退避した後、いったん本番V10を空にして消失状態を確認し、その直後に救出JSONから復帰します。途中で失敗した場合は復帰前データへ自動ロールバックします。<button id="restore">消失→救出JSON復帰を通しテスト</button></div><div id="result" class="card hidden"></div><pre id="log">救出JSONを選択してください。</pre><script>const KEY='taxiPayPwaStateV10',BACKUP_KEY='taxiPayProductionRescueBeforeRestoreV1',RECOVERY_KEY='taxiPayRecoverySnapshotsV1';const $=id=>document.getElementById(id);let normalized=null;function parse(raw){try{return{ok:true,value:JSON.parse(raw)}}catch(e){return{ok:false,error:e}}}function isState(s){return !!s&&typeof s==='object'&&!Array.isArray(s)&&Array.isArray(s.entries)&&Array.isArray(s.history)&&s.settings&&typeof s.settings==='object'}function normalizeInput(x){if(isState(x))return{state:x,format:'raw-production-state'};if(x&&['taxi-pay-production-rescue-v1','taxi-pay-production-rescue-merged-v1'].includes(x.rescueFormat)&&x.key===KEY&&isState(x.state))return{state:x.state,format:x.rescueFormat};throw new Error('対応する本番救出JSONではありません。')}function sums(s){const e=s.entries;return{entries:e.length,history:s.history.length,dates:e.map(x=>x.date).filter(Boolean).sort(),gross:e.reduce((a,x)=>a+Number(x.grossRevenue??x.adjustedGrossSales??0),0)}}function snapshotCurrent(raw,stamp){if(raw===null)return;const old=parse(localStorage.getItem(RECOVERY_KEY)||'[]');const rows=old.ok&&Array.isArray(old.value)?old.value:[];if(rows.at(-1)?.raw!==raw)rows.push({at:stamp,sourceKey:KEY,reason:'before:manual-rescue-restore',raw});localStorage.setItem(RECOVERY_KEY,JSON.stringify(rows.slice(-5)))}function validateIncoming(s){if(!isState(s))throw new Error('state形式が不正です');const summary=sums(s);if(summary.entries+summary.history<=0)throw new Error('勤務実績・締め履歴が0件です');for(const e of s.entries){if(!e||typeof e!=='object'||!e.date)throw new Error('勤務実績に日付のないデータがあります')}JSON.stringify(s);return summary}$('file').onchange=()=>{$('fileinfo').textContent=$('file').files[0]?.name||'未選択';normalized=null;$('preview').classList.add('hidden');$('restoreBox').classList.add('hidden');$('result').classList.add('hidden')};$('inspect').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw new Error('救出JSONを選択してください');const p=parse(await f.text());if(!p.ok)throw new Error('JSONを解析できません');normalized=normalizeInput(p.value);const incoming=validateIncoming(normalized.state),currentRaw=localStorage.getItem(KEY),cp=currentRaw===null?null:parse(currentRaw),current=cp&&cp.ok&&isState(cp.value)?sums(cp.value):{entries:0,history:0,dates:[],gross:0};$('preview').className='card ok';$('preview').innerHTML='<div class="summary">復帰内容の確認</div><div class="kv"><div>救出件数</div><div>'+incoming.entries+'件</div><div>救出日付</div><div>'+incoming.dates.join(', ')+'</div><div>救出営収合計</div><div>'+incoming.gross.toLocaleString('ja-JP')+'円</div><div>現在の本番件数</div><div>'+current.entries+'件</div></div>';$('preview').classList.remove('hidden');$('restoreBox').classList.remove('hidden');$('log').textContent=JSON.stringify({mode:'PREVIEW_ONLY',incoming,current},null,2)}catch(e){normalized=null;$('restoreBox').classList.add('hidden');$('log').textContent='ERROR: '+e.message}};$('restore').onclick=()=>{let beforeRaw=localStorage.getItem(KEY);try{if(!normalized)throw new Error('先に内容を確認してください');const incoming=validateIncoming(normalized.state),stamp=new Date().toISOString();const bp=beforeRaw===null?null:parse(beforeRaw);const beforePack={rescueFormat:'taxi-pay-production-before-restore-v1',createdAt:stamp,key:KEY,state:bp&&bp.ok?bp.value:null};localStorage.setItem(BACKUP_KEY,JSON.stringify(beforePack));if(localStorage.getItem(BACKUP_KEY)!==JSON.stringify(beforePack))throw new Error('復帰前退避に失敗');snapshotCurrent(beforeRaw,stamp);const rc=parse(localStorage.getItem(RECOVERY_KEY)||'[]');if(beforeRaw!==null&&(!rc.ok||!Array.isArray(rc.value)||!rc.value.some(x=>x.raw===beforeRaw)))throw new Error('復旧スナップショットの作成に失敗');localStorage.removeItem(KEY);if(localStorage.getItem(KEY)!==null)throw new Error('消失状態を作れませんでした');$('log').textContent='STEP 1/2: 本番V10が空になったことを確認。\nSTEP 2/2: 救出JSONから復帰中…';const incomingRaw=JSON.stringify(normalized.state);localStorage.setItem(KEY,incomingRaw);const verifyRaw=localStorage.getItem(KEY);if(verifyRaw!==incomingRaw)throw new Error('書き込み後の完全一致照合に失敗');const vp=parse(verifyRaw);if(!vp.ok||!isState(vp.value))throw new Error('復帰後JSONの再解析に失敗');const verified=sums(vp.value);if(verified.entries!==incoming.entries||verified.history!==incoming.history||JSON.stringify(verified.dates)!==JSON.stringify(incoming.dates)||verified.gross!==incoming.gross)throw new Error('復帰後の件数・日付・営収検証に失敗');$('result').className='card ok';$('result').innerHTML='<div class="success">救出→復帰 通しテスト成功</div><div>本番V10を一度消失させた後、救出JSONだけから復元しました。</div><div class="kv"><div>復帰件数</div><div>'+verified.entries+'件</div><div>日付</div><div>'+verified.dates.join(', ')+'</div><div>営収合計</div><div>'+verified.gross.toLocaleString('ja-JP')+'円</div></div><button id="openProd">本番アプリを開いて確認</button>';$('result').classList.remove('hidden');$('restoreBox').classList.add('hidden');$('log').textContent=JSON.stringify({status:'END_TO_END_RESTORE_SUCCESS',lossStateVerified:true,exactRawVerified:true,summaryVerified:true,summary:verified},null,2);$('openProd').onclick=()=>location.href='https://ttyseto-1027.github.io/taxi-pay-pwa/'}catch(e){try{if(beforeRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,beforeRaw)}catch{}$('log').textContent='ERROR: '+e.message+'\n本番V10は復帰前データへロールバックしました。'}};</script></body></html>
